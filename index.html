<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="一个简单易用的在线图片压缩工具">
    <title>图片压缩工具</title>
    <link rel="stylesheet" href="style.css">
    <!-- Open Graph 标签 -->
    <meta property="og:title" content="图片压缩工具">
    <meta property="og:description" content="一个简单易用的在线图片压缩工具">
    <meta property="og:type" content="website">
</head>
<body>
    <!-- 页面头部 -->
    <header class="header">
        <h1>图片压缩工具</h1>
        <p>简单易用的在线图片压缩工具</p>
    </header>

    <!-- 主要内容区 -->
    <main class="main">
        <!-- 上传区域 -->
        <section class="upload-section">
            <div class="upload-area" id="uploadArea">
                <input type="file" id="imageInput" accept="image/*" hidden>
                <button class="upload-btn" onclick="document.getElementById('imageInput').click()">
                    选择图片
                </button>
                <p class="upload-tip">支持 PNG、JPG 等格式</p>
            </div>
        </section>

        <!-- 预览和控制区域 -->
        <section class="preview-section" id="previewSection" style="display: none;">
            <div class="preview-container">
                <!-- 原图预览 -->
                <div class="preview-box">
                    <h3>原图</h3>
                    <div class="image-container">
                        <img id="originalImage" alt="原图预览">
                    </div>
                    <div class="file-info">
                        <span>文件大小: </span>
                        <span id="originalSize">0 KB</span>
                    </div>
                </div>

                <!-- 压缩图预览 -->
                <div class="preview-box">
                    <h3>压缩后</h3>
                    <div class="image-container">
                        <img id="compressedImage" alt="压缩后预览">
                    </div>
                    <div class="file-info">
                        <span>文件大小: </span>
                        <span id="compressedSize">0 KB</span>
                    </div>
                </div>
            </div>

            <!-- 压缩控制 -->
            <div class="compress-controls">
                <div class="quality-control">
                    <label for="quality">压缩质量:</label>
                    <input type="range" id="quality" min="0" max="100" value="80">
                    <span id="qualityValue">80%</span>
                </div>
                <button class="download-btn" id="downloadBtn">下载压缩图片</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
